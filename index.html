<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Calculator</title>
</head>
<body>
  <div class="calculator-container" id="calculator">
  <input class="display" id="display" readonly >
  <div class="keys-container" id="keys">
    <button id="plus-btn" class="opp-btn">+</button>
    <button id="seven-btn">7</button>
    <button id="eight-btn">8</button>
    <button id="nine-btn">9</button>
    <button id="minus-btn" class="opp-btn">-</button>
    <button id="four-btn">4</button>
    <button id="five-btn">5</button>
    <button id="six-btn">6</button>
    <button id="multi-btn" class="opp-btn">x</button>
    <button id="one-btn">1</button>
    <button id="two-btn">2</button>
    <button id="three-btn">3</button>
    <button id="divide-btn" class="opp-btn">/</button>
    <button id="zero-btn">0</button>
    <button id="dec-btn" class="opp-btn">.</button>
    <button id="equal-btn" class="opp-btn">=</button>
    <button id="clear-btn" class="opp-btn">C</button>
    <!--<button id=""></button>
    <button id=""></button>
    <button id=""></button>-->
  </div>
  </div>


  <script src="script.js"></script>
</body>
</html>
